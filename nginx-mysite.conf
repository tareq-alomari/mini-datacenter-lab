# /etc/nginx/sites-available/mysite.local
# Microservices Simulation Lab — Reverse Proxy
# default_server: يجيب على أي طلب لا يطابق خادمًا آخر
# (بما فيها http://192.168.0.4 مباشرة من الهاتف — وهذا شرط الـ DoD)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name mysite.local _;

    root /var/www/mysite;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # مثال المرحلة القادمة (الميكروسيرفيس) — اتركه معلّقًا الآن:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000/;
    # }
}
