# ============================================================
# Microservices Simulation Lab — أُضيفت إلى /etc/dnsmasq.conf
# (ليست drop-in: conf-dir معلّق افتراضيًا في Ubuntu 24.04)
# للإزالة: احذف هذه الكتلة ثم sudo systemctl restart dnsmasq
# ============================================================

# DNS: mysite.local -> عنوان IP هذا الجهاز على الـ Wi-Fi
address=/mysite.local/192.168.0.4

# DHCP مبطّل عمدًا على الشبكة الحية: الراوتر (192.168.0.1) هو من يوزّع
# العناوين، وتشغيل خادم DHCP ثانٍ قد يمنح الأجهزة عناوين متضاربة.
# لتفعيله على شبكة معزولة (Hotspot الهاتف) أزل التعليق من السطرين
# وأضف interface=<اسم واجهة الـ hotspot> ثم أعد التشغيل:
# dhcp-range=192.168.0.50,192.168.0.150,12h
# interface=<hotspot-interface>
# (ملاحظة: مع وجود interface= يُخدم DHCP على تلك الواجهة فقط)
